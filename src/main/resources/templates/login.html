<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Hostel Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-body d-flex align-items-center justify-content-center min-vh-100 py-4 px-3 position-relative">

    <!-- Top Right Theme Switcher -->
    <div class="position-absolute top-0 end-0 p-3 z-3">
        <button type="button" class="theme-toggle-btn shadow-sm">
            <i class="bi bi-moon-stars-fill text-primary"></i>
            <span class="theme-label small">Dark Mode</span>
        </button>
    </div>

    <!-- CENTERED LOGIN CARD -->
    <div class="login-card-container">
        <div class="login-card p-4 p-sm-5">
            
            <!-- HEADER -->
            <div class="text-center mb-4">
                <div class="stat-icon-wrapper bg-icon-primary mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.6rem;">
                    <i class="bi bi-building-lock"></i>
                </div>
                <h2 class="fw-bold text-white mb-1 fs-3">Smart Hostel Management</h2>
                <p class="text-slate-400 small mb-0">Sign in to access your hostel portal</p>
            </div>

            <!-- ALERT MESSAGES -->
            <div th:if="${param.error != null and #strings.equals(param.error[0], 'role_mismatch')}" 
                 class="alert alert-custom-danger alert-dismissible fade show d-flex align-items-center gap-2 mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill fs-5 flex-shrink-0"></i>
                <div class="small">Selected role does not match this account.</div>
                <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${param.error != null and !#strings.equals(param.error[0], 'role_mismatch')}" 
                 class="alert alert-custom-danger alert-dismissible fade show d-flex align-items-center gap-2 mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill fs-5 flex-shrink-0"></i>
                <div class="small">Invalid username or password.</div>
                <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${param.logout}" 
                 class="alert alert-custom-success alert-dismissible fade show d-flex align-items-center gap-2 mb-4" role="alert">
                <i class="bi bi-check-circle-fill fs-5 flex-shrink-0"></i>
                <div class="small">You have been signed out successfully.</div>
                <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="alert"></button>
            </div>

            <!-- LOGIN FORM -->
            <form th:action="@{/login}" method="post" id="loginForm">
                
                <!-- USERNAME -->
                <div class="form-group mb-3">
                    <label for="usernameInput" class="form-label text-slate-200 fw-medium small">USERNAME</label>
                    <div class="custom-input-wrapper">
                        <i class="bi bi-person custom-input-icon"></i>
                        <input type="text" id="usernameInput" name="username" class="custom-input" 
                               placeholder="Enter your username" required autofocus autocomplete="username">
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="form-group mb-4">
                    <label for="passwordInput" class="form-label text-slate-200 fw-medium small">PASSWORD</label>
                    <div class="custom-input-wrapper">
                        <i class="bi bi-lock custom-input-icon"></i>
                        <input type="password" id="passwordInput" name="password" class="custom-input" 
                               placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" id="togglePasswordBtn" title="Toggle password visibility" aria-label="Show password">
                            <i class="bi bi-eye" id="toggleEyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- LOGIN AS (ROLE SELECTOR) -->
                <div class="form-group mb-4">
                    <label class="form-label text-slate-200 fw-medium small mb-2">LOGIN AS</label>
                    <div class="segmented-role-container">
                        <div class="role-option flex-fill">
                            <input type="radio" class="btn-check" name="role" id="roleAdmin" value="ADMIN" autocomplete="off">
                            <label class="role-segmented-btn w-100" for="roleAdmin">
                                <i class="bi bi-shield-lock-fill me-2"></i>Admin
                            </label>
                        </div>
                        <div class="role-option flex-fill">
                            <input type="radio" class="btn-check" name="role" id="roleStudent" value="STUDENT" checked autocomplete="off">
                            <label class="role-segmented-btn w-100" for="roleStudent">
                                <i class="bi bi-mortarboard-fill me-2"></i>Student
                            </label>
                        </div>
                    </div>
                </div>

                <!-- SIGN IN BUTTON -->
                <button type="submit" class="btn btn-login-submit w-100" id="submitBtn">
                    <span id="btnText">Sign In</span>
                    <i class="bi bi-arrow-right-short fs-4" id="btnIcon"></i>
                </button>

            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        // Password visibility toggle
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('passwordInput');
        const toggleEyeIcon = document.getElementById('toggleEyeIcon');

        if (togglePasswordBtn && passwordInput && toggleEyeIcon) {
            togglePasswordBtn.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                if (type === 'text') {
                    toggleEyeIcon.classList.remove('bi-eye');
                    toggleEyeIcon.classList.add('bi-eye-slash');
                    togglePasswordBtn.setAttribute('aria-label', 'Hide password');
                } else {
                    toggleEyeIcon.classList.remove('bi-eye-slash');
                    toggleEyeIcon.classList.add('bi-eye');
                    togglePasswordBtn.setAttribute('aria-label', 'Show password');
                }
            });
        }

        // Form Submit Loading State
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        if (loginForm && submitBtn) {
            loginForm.addEventListener('submit', function () {
                submitBtn.disabled = true;
                if (btnText) btnText.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Signing In...';
                if (btnIcon) btnIcon.style.display = 'none';
            });
        }
    </script>
</body>
</html>
